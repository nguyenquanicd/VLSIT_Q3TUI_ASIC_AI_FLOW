e Agent SDK query()</tspan><tspan x="17.0" y="89.297">In-process MCP tools (mcp__q3tui__*)</tspan><tspan x="17.0" y="91.094">hook PreToolUse · pydantic output</tspan></text><rect x="35" y="79" width="30" height="17" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217" /><text x="50.0" y="83.906" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="83.906">HDL layer</tspan><tspan x="50.0" y="85.703">hdl/: filelist, pyslang</tspan><tspan x="50.0" y="87.500">parse RTL, module list,</tspan><tspan x="50.0" y="89.297">rule check</tspan><tspan x="50.0" y="91.094">(runs in the Python process)</tspan></text><rect x="68" y="79" width="30" height="17" rx="1.2" fill="#FFF2CC" stroke="#7F6000" stroke-width="0.217" /><text x="83.0" y="83.906" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="83.0" y="83.906">Tools theo role</tspan><tspan x="83.0" y="85.703">eda/tools.py + config/tools.json</tspan><tspan x="83.0" y="87.500">lint · synth · sim · cdc · …</tspan><tspan x="83.0" y="89.297">command template + log parser</tspan><tspan x="83.0" y="91.094">missing role tool → N/A</tspan></text><line x1="17.0" y1="76" x2="17.000" y2="77.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="17.0,79 16.450,77.300 17.550,77.300" fill="#323E4F" /><line x1="50.0" y1="76" x2="50.000" y2="77.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="50.0,79 49.450,77.300 50.550,77.300" fill="#323E4F" /><line x1="83.0" y1="76" x2="83.000" y2="77.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="83.0,79 82.450,77.300 83.550,77.300" fill="#323E4F" /><polyline points="17,75 83,75" fill="none" stroke="#323E4F" stroke-width="0.217" /><rect x="2" y="100" width="30" height="8" rx="1.2" fill="#FFFFFF" stroke="#323E4F" stroke-width="0.217"