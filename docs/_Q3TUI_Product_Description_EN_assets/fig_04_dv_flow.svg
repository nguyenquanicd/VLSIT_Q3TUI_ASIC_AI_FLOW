dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="#595959"><tspan x="50" y="62.102">Two testbench types (tb step option testbench): plain — any IP, reviewed test plan;</tspan><tspan x="50" y="63.898">uvm — AXI-style IP with an existing VIP, verification contract.</tspan></text><text x="50" y="68.000" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="#595959"><tspan x="50" y="68.000">The testbench never sees RTL (until final integration in the UVM backend); RTL cannot see src/tb/.</tspan></text></svg>