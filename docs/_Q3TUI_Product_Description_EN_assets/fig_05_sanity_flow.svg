5.300,40.550 55.300,39.450" fill="#323E4F"/><line x1="77" y1="40.0" x2="80.300" y2="40.000" stroke="#323E4F" stroke-width="0.217"/><polygon points="82,40.0 80.300,40.550 80.300,39.450" fill="#323E4F"/><polyline points="31,26.0 34.5,26 34.5,12" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="34.5" y1="12" x2="36.300" y2="12.000" stroke="#323E4F" stroke-width="0.217"/><polygon points="38,12 36.300,12.550 36.300,11.450" fill="#323E4F"/><polyline points="34.5,26 34.5,40" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="34.5" y1="40" x2="36.300" y2="40.000" stroke="#323E4F" stroke-width="0.217"/><polygon points="38,40 36.300,40.550 36.300,39.450" fill="#323E4F"/><text x="50" y="52.000" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.606" font-weight="normal" font-style="normal" fill="#595959"><tspan x="50" y="52.000">Each violation is classified as: waiver · RTL fix · spec question · SDC request · user question</tspan></text><rect x="2" y="55" width="96" height="10" rx="1.2" fill="#F2F2F2" stroke="#595959" stroke-width="0.217"/><text x="50.0" y="58.203" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="58.203">q3tui --flow sanity loop: analysis + review → sanity_handoff → rtl flow fixes RTL → re-analysis.</tspan><tspan x="50.0" y="60.000">Stops when no open violations remain (clean), a round fails to improve on the best round, or --max-rounds / --max-cost is reached;</tspan><tspan x="50.0" y="61.797">the best round’s RTL is kept in .q3tui/loop/best_rtl/.</tspan></text></svg>