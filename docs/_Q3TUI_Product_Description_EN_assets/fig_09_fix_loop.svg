<svg xmlns="http://www.w3.org/2000/svg" width="1408px" height="986px" viewBox="0 0 100 70"><rect width="100%" height="100%" fill="white" /><rect x="2" y="4" width="28" height="9" rx="1.2" fill="#FFF2CC" stroke="#7F6000" stroke-width="0.217" /><text x="16.0" y="7.602" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="16.0" y="7.602">Checking step</tspan><tspan x="16.0" y="9.398">(format · lint · smoke · simulate · check)</tspan></text><polygon points="42,3.0 51.0,8.5 42,14.0 33.0,8.5" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217" /><text x="42" y="8.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.736" font-weight="normal" font-style="normal" fill="black"><tspan x="42" y="8.500">Pass?</tspan></text><line x1="30" y1="8.5" x2="31.300" y2="8.500" stroke="#323E4F" stroke-width="0.217" /><polygon points="33,8.5 31.300,9.050 31.300,7.950" fill="#323E4F" /><rect x="72" y="4" width="26" height="9" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217" /><text x="85.0" y="8.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.649" font-weight="normal" font-style="normal" fill="black"><tspan x="85.0" y="8.500">Continue / gate review</tspan></text><line x1="51" y1="8.5" x2="70.300" y2="8.500" stroke="#323E4F" stroke-width="0.217" /><polygon points="72,8.5 70.300,9.050 70.300,7.950" fill="#323E4F" /><text x="61.5" y="6.300" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="black"><tspan x="61.5" y="6.300">pass</tspan></text><rect x="28" y="25" width="44" height="10" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217" /><text x="50.0" y="29.102" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="29.102">Triage: who owns the failure? (LLM reads tool results and history)</tspan><tspan x="50.0" y="30.898">→ scoped change request [rtl:&lt;module&gt;] …</tspan></text><line x1="42" y1="14" x2="45.419" y2="23.402" stroke="#323E4F" stroke-width="0.217" /><polygon points="46,25 44.902,23.590 45.936,23.214" fill="#323E4F" /><text x="37" y="19.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="black"><tspan x="37" y="19.500">no</tspan></text><rect x="28" y="42" width="44" height="9" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217" /><text x="50.0" y="45.602" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="45.602">The owning step updates only the named unit</tspan><tspan x="50.0" y="47.398">(patch; do not rewrite the entire step)</tspan></text><line x1="50.0" y1="35" x2="50.000" y2="40.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="50.0,42 49.450,40.300 50.550,40.300" fill="#323E4F" /><polyline points="28,46.5 8,46.5" fill="none" stroke="#323E4F" stroke-width="0.217" /><line x1="8" y1="46.5" x2="8.000" y2="14.700" stroke="#323E4F" stroke-width="0.217" /><polygon points="8,13 8.550,14.700 7.450,14.700" fill="#323E4F" /><text x="14" y="29.127" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="#7030A0"><tspan x="14" y="29.127">rerun</tspan><tspan x="14" y="30.873">checking step</tspan></text><rect x="2" y="57" width="96" height="11" rx="1.2" fill="#F2F2F2" stroke="#595959" stroke-width="0.217" /><text x="50.0" y="60.753" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="60.753">Stop when: pipeline.max_fix_iterations is reached (or the step’s options.max_fix_rounds) · the same finding repeats</tspan><tspan x="50.0" y="62.500">pipeline.escalate_after_repeats times → ask the user · a bound means the step fails, never "passes" the remaining work.</tspan><tspan x="50.0" y="64.247">Fixes owned by another flow (dv → RTL): hand_to_flow, handled in the same run.</tspan></text></svg>