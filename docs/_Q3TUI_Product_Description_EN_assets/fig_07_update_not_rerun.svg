<svg xmlns="http://www.w3.org/2000/svg" width="1408px" height="1352px" viewBox="0 0 100 96"><rect width="100%" height="100%" fill="white"/><rect x="26" y="2" width="48" height="8" rx="1.2" fill="#FFFFFF" stroke="#323E4F" stroke-width="0.217"/><text x="50.0" y="5.052" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.649" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="5.052">Step input changes: spec, REQ, answer,</tspan><tspan x="50.0" y="6.948">change request, or a user-edited file</tspan></text><rect x="26" y="15" width="48" height="8" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="50.0" y="18.077" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.606" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="18.077">Compare with the step_meta snapshot in pipeline.json</tspan><tspan x="50.0" y="19.923">(code diff: which section / REQ / module / answer changed)</tspan></text><line x1="50.0" y1="10" x2="50.000" y2="13.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="50.0,15 49.450,13.300 50.550,13.300" fill="#323E4F"/><polygon points="50,29.0 70.0,35 50,41.0 30.0,35" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217"/><text x="50" y="34.064" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.628" font-weight="normal" font-style="normal" fill="black"><tspan x="50" y="34.064">Relevant</tspan><tspan x="50" y="35.936">change?</tspan></text><line x1="50.0" y1="23" x2="50.000" y2="27.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="50,29 49.450,27.300 50.550,27.300" fill="#323E4F"/><rect x="2" y="49" width="38" height="13" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="21.0" y="53.653" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.606" font-weight="normal" font-style="normal" fill="black"><tspan x="21.0" y="53.653">No: do not call the LLM</tspan><tspan x="21.0" y="55.500">ctx.unchanged = True</tspan><tspan x="21.0" y="57.347">Keep the artifact and approval</tspan></text><polyline points="30,35 21,35" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="21" y1="35" x2="21.000" y2="47.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="21,49 20.450,47.300 21.550,47.300" fill="#323E4F"/><text x="25.5" y="32.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="black"><tspan x="25.5" y="32.500">no</tspan></text><rect x="50" y="49" width="48" height="13" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217"/><text x="74.0" y="53.703" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="74.0" y="53.703">Yes: the LLM receives the current artifact + only the changed parts,</tspan><tspan x="74.0" y="55.500">and returns a patch containing only those changes</tspan><tspan x="74.0" y="57.297">Code applies the patch; all other bytes remain unchanged</tspan></text><polyline points="70,35 74,35" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="74" y1="35" x2="74.000" y2="47.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="74,49 73.450,47.300 74.550,47.300" fill="#323E4F"/><text x="71.5" y="32.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="black"><tspan x="71.5" y="32.500">yes</tspan></text><rect x="50" y="67" width="48" height="9" rx="1.2" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217"/><text x="74.0" y="70.602" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="74.0" y="70.602">A real change → reopen the step review</tspan><tspan x="74.0" y="72.398">(changed parts are listed in the log)</tspan></text><line x1="74" y1="62" x2="74.000" y2="65.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="74,67 73.450,65.300 74.550,65.300" fill="#323E4F"/><rect x="26" y="84" width="60" height="8" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="56.0" y="87.077" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.606" font-weight="normal" font-style="normal" fill="black"><tspan x="56.0" y="87.077">Write a new snapshot; downstream steps detect the hash change</tspan><tspan x="56.0" y="88.923">and update in the same way</tspan></text><polyline points="21,62 21,88" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="21" y1="88" x2="24.300" y2="88.000" stroke="#323E4F" stroke-width="0.217"/><polygon points="26,88 24.300,88.550 24.300,87.450" fill="#323E4F"/><line x1="74" y1="76" x2="74.000" y2="82.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="74,84 73.450,82.300 74.550,82.300" fill="#323E4F"/></svg>