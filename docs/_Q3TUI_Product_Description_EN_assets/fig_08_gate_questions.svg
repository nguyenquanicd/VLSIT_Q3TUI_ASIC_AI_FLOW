<svg xmlns="http://www.w3.org/2000/svg" width="1408px" height="1324px" viewBox="0 0 100 94"><rect width="100%" height="100%" fill="white"/><rect x="30" y="2" width="40" height="7" rx="1.2" fill="#FFFFFF" stroke="#323E4F" stroke-width="0.217"/><text x="50.0" y="5.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.736" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="5.500">Step completes (stages D / L / T)</tspan></text><rect x="26" y="14" width="48" height="9" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217"/><text x="50.0" y="17.602" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="17.602">Step questions: each has a default_assumption</tspan><tspan x="50.0" y="19.398">and 2–4 options with design impact (area/speed/power/complexity)</tspan></text><line x1="50.0" y1="9" x2="50.000" y2="12.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="50.0,14 49.450,12.300 50.550,12.300" fill="#323E4F"/><polygon points="50,29.5 72.0,36 50,42.5 28.0,36" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217"/><text x="50" y="35.064" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.628" font-weight="normal" font-style="normal" fill="black"><tspan x="50" y="35.064">Gate mode</tspan><tspan x="50" y="36.936">for this step?</tspan></text><line x1="50.0" y1="23" x2="50.000" y2="27.800" stroke="#323E4F" stroke-width="0.217"/><polygon points="50,29.5 49.450,27.800 50.550,27.800" fill="#323E4F"/><rect x="2" y="51" width="22" height="12" rx="1.2" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217"/><text x="13.0" y="54.380" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="13.0" y="54.380">human</tspan><tspan x="13.0" y="56.127">pause for review:</tspan><tspan x="13.0" y="57.873">approve · answer ·</tspan><tspan x="13.0" y="59.620">edit · change request</tspan></text><rect x="27" y="51" width="22" height="12" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="38.0" y="54.380" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="38.0" y="54.380">auto</tspan><tspan x="38.0" y="56.127">auto-approve when done;</tspan><tspan x="38.0" y="57.873">blocking questions</tspan><tspan x="38.0" y="59.620">still pause</tspan></text><rect x="52" y="51" width="22" height="12" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="63.0" y="54.380" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="63.0" y="54.380">auto_answer</tspan><tspan x="63.0" y="56.127">unattended: approve all;</tspan><tspan x="63.0" y="57.873">all questions use</tspan><tspan x="63.0" y="59.620">their default values</tspan></text><rect x="77" y="51" width="21" height="12" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217"/><text x="87.5" y="55.253" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="87.5" y="55.253">none</tspan><tspan x="87.5" y="57.000">no review gate</tspan><tspan x="87.5" y="58.747">(blocking questions still pause)</tspan></text><polyline points="28,36 13,36" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="13" y1="36" x2="13.000" y2="49.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="13,51 12.450,49.300 13.550,49.300" fill="#323E4F"/><polyline points="50,42.5 50,46 38,46" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="38" y1="46" x2="38.000" y2="49.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="38,51 37.450,49.300 38.550,49.300" fill="#323E4F"/><polyline points="50,46 63,46" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="63" y1="46" x2="63.000" y2="49.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="63,51 62.450,49.300 63.550,49.300" fill="#323E4F"/><polyline points="72,36 87.5,36" fill="none" stroke="#323E4F" stroke-width="0.217"/><line x1="87.5" y1="36" x2="87.500" y2="49.300" stroke="#323E4F" stroke-width="0.217"/><polygon points="87.5,51 86.950,49.300 88.050,49.300" fill="#323E4F"/><rect x="2" y="68" width="96" height="24" rx="1.2" fill="#F2F2F2" stroke="#595959" stroke-width="0.217"/><text x="4" y="71.500" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.693" font-weight="bold" font-style="normal" fill="black"><tspan x="4" y="71.500">Questions go to the step that owns the artifact (by kind):</tspan></text><text x="5" y="75.500" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="5" y="75.500">spec_gap — missing / ambiguous / conflicting spec  →  spec step</tspan></text><text x="5" y="78.800" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="5" y="78.800">req_gap — missing or incorrect requirement  →  flow gap_targets (spec flow: parse)</tspan></text><text x="5" y="82.100" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="5" y="82.100">arch_gap — incorrect configuration decision  →  flow gap_targets (spec flow: config)</tspan></text><text x="5" y="85.400" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="5" y="85.400">design_choice — a decision made by the step  →  stays with the asking step</tspan></text><text x="5" y="89.000" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="italic" fill="#595959"><tspan x="5" y="89.000">Questions point upstream only, never downstream; an answer creates a [decision] change request on the owning step.</tspan></text></svg>