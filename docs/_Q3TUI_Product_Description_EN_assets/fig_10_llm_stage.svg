<svg xmlns="http://www.w3.org/2000/svg" width="1408px" height="1183px" viewBox="0 0 100 84"><rect width="100%" height="100%" fill="white" /><rect x="2" y="4" width="28" height="14" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217" /><text x="16.0" y="8.305" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="16.0" y="8.305">Step (code)</tspan><tspan x="16.0" y="10.102">Stage(...): prompt,</tspan><tspan x="16.0" y="11.898">tool allow-list, output_model,</tspan><tspan x="16.0" y="13.695">cwd, add_dirs, deny_dirs</tspan></text><rect x="36" y="4" width="28" height="14" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217" /><text x="50.0" y="8.305" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="8.305">llm/runtime.run_stage</tspan><tspan x="50.0" y="10.102">model, effort, provider</tspan><tspan x="50.0" y="11.898">session: fresh / flow / team</tspan><tspan x="50.0" y="13.695">checkpoint, token budget</tspan></text><rect x="70" y="4" width="28" height="14" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217" /><text x="84.0" y="8.305" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="84.0" y="8.305">Claude Agent SDK</tspan><tspan x="84.0" y="10.102">query(), permission_mode</tspan><tspan x="84.0" y="11.898">= dontAsk</tspan><tspan x="84.0" y="13.695">(provider selects destination)</tspan></text><line x1="30" y1="11.0" x2="34.300" y2="11.000" stroke="#323E4F" stroke-width="0.217" /><polygon points="36,11.0 34.300,11.550 34.300,10.450" fill="#323E4F" /><line x1="64" y1="11.0" x2="68.300" y2="11.000" stroke="#323E4F" stroke-width="0.217" /><polygon points="70,11.0 68.300,11.550 68.300,10.450" fill="#323E4F" /><rect x="36" y="28" width="28" height="12" rx="1.2" fill="#FBE4D5" stroke="#C55A11" stroke-width="0.217" /><text x="50.0" y="32.253" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="32.253">Hook PreToolUse</tspan><tspan x="50.0" y="34.000">allow only Stage.cwd + add_dirs</tspan><tspan x="50.0" y="35.747">block deny_dirs and .q3tui/</tspan></text><rect x="70" y="28" width="28" height="12" rx="1.2" fill="#FFF2CC" stroke="#7F6000" stroke-width="0.217" /><text x="84.0" y="31.380" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.519" font-weight="normal" font-style="normal" fill="black"><tspan x="84.0" y="31.380">Allowed tools</tspan><tspan x="84.0" y="33.127">Read · Grep · Glob (+ Write/Edit)</tspan><tspan x="84.0" y="34.873">mcp__q3tui__* · Bash only for</tspan><tspan x="84.0" y="36.620">a tool-role command</tspan></text><line x1="84" y1="18" x2="84.000" y2="26.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="84,28 83.450,26.300 84.550,26.300" fill="#323E4F" /><line x1="70" y1="34" x2="65.700" y2="34.000" stroke="#323E4F" stroke-width="0.217" /><polygon points="64,34 65.700,33.450 65.700,34.550" fill="#323E4F" /><rect x="36" y="50" width="28" height="10" rx="1.2" fill="#EBDDF5" stroke="#7030A0" stroke-width="0.217" /><text x="50.0" y="54.102" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="54.102">Structured result</tspan><tspan x="50.0" y="55.898">(JSON from the pydantic schema)</tspan></text><polyline points="84,40 84,45 50,45" fill="none" stroke="#323E4F" stroke-width="0.217" /><line x1="50" y1="45" x2="50.000" y2="48.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="50,50 49.450,48.300 50.550,48.300" fill="#323E4F" /><rect x="36" y="66" width="28" height="10" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217" /><text x="50.0" y="70.102" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="70.102">run_stage validates with pydantic;</tspan><tspan x="50.0" y="71.898">invalid → ask again in the same session</tspan></text><line x1="50.0" y1="60" x2="50.000" y2="64.300" stroke="#323E4F" stroke-width="0.217" /><polygon points="50.0,66 49.450,64.300 50.550,64.300" fill="#323E4F" /><rect x="2" y="66" width="28" height="10" rx="1.2" fill="#DEE6F0" stroke="#323E4F" stroke-width="0.217" /><text x="16.0" y="70.102" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="16.0" y="70.102">Code writes files, runs deterministic</tspan><tspan x="16.0" y="71.898">checks, and owns the fix loop</tspan></text><line x1="36" y1="71.0" x2="31.700" y2="71.000" stroke="#323E4F" stroke-width="0.217" /><polygon points="30,71.0 31.700,70.450 31.700,71.550" fill="#323E4F" /><rect x="70" y="66" width="28" height="10" rx="1.2" fill="#FFFFFF" stroke="#323E4F" stroke-width="0.217" /><text x="84.0" y="70.102" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="84.0" y="70.102">Logs: events.jsonl,</tspan><tspan x="84.0" y="71.898">stats.jsonl (cost / stage)</tspan></text><line x1="64" y1="71.0" x2="68.300" y2="71.000" stroke="#323E4F" stroke-width="0.217" /><polygon points="70,71.0 68.300,71.550 68.300,70.450" fill="#323E4F" /><text x="50" y="81.000" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.649" font-weight="bold" font-style="normal" fill="#7030A0"><tspan x="50" y="81.000">Every LLM call goes through one function: q3tui.llm.runtime.run_stage</tspan></text></svg>