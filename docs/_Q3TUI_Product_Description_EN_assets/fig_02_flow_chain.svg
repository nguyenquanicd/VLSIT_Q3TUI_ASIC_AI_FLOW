New Roman, serif" font-size="2.062" font-weight="bold" font-style="normal" fill="black"><tspan x="88.65" y="7.750">fpga / asic</tspan></text><rect x="80.4" y="10.5" width="16.5" height="17" rx="1.2" fill="#FFFFFF" stroke="#323E4F" stroke-width="0.217"/><text x="88.65" y="15.406" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="normal" fill="black"><tspan x="88.65" y="15.406">PPA, synthesis,</tspan><tspan x="88.65" y="17.203">LEC</tspan><tspan x="88.65" y="19.000"></tspan><tspan x="88.65" y="20.797">timing report: human</tspan><tspan x="88.65" y="22.594">ppa_optimize: human</tspan></text><line x1="18.5" y1="13.5" x2="19.900" y2="13.500" stroke="#323E4F" stroke-width="0.217"/><polygon points="21.6,13.5 19.900,14.050 19.900,12.950" fill="#323E4F"/><line x1="38.1" y1="13.5" x2="39.500" y2="13.500" stroke="#323E4F" stroke-width="0.217"/><polygon points="41.2,13.5 39.500,14.050 39.500,12.950" fill="#323E4F"/><line x1="57.7" y1="13.5" x2="59.100" y2="13.500" stroke="#323E4F" stroke-width="0.217"/><polygon points="60.800000000000004,13.5 59.100,14.050 59.100,12.950" fill="#323E4F"/><line x1="77.30000000000001" y1="13.5" x2="78.700" y2="13.500" stroke="#323E4F" stroke-width="0.217"/><polygon points="80.4,13.5 78.700,14.050 78.700,12.950" fill="#323E4F"/><text x="50" y="1.500" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.780" font-weight="bold" font-style="normal" fill="#7030A0"><tspan x="50" y="1.500">pipeline.chain flow (default: spec → rtl → dv → sanity → fpga)</tspan></text><polyline points="91.5,27.5 91.5,33 22,33" fill="none" stroke="#7030A0" stroke-width="0.217" stroke-dasharray="1.5,1.0"/><polyline points="71.9,27.5 71.9,33" fill="none" stroke="#7030A0" stroke-width="0.217" stroke-dasharray="1.5,1.0"/><polyline points="52.3,27.5 52.3,33" fill="none" stroke="#7030A0" stroke-width="0.217" stroke-dasharray="1.5,1.0"/><line x1="22" y1="33" x2="22.000" y2="29.200" stroke="#7030A0" stroke-width="0.217" stroke-dasharray="1.5,1.0"/><polygon points="22,27.5 22.550,29.200 21.450,29.200" fill="#7030A0"/><text x="50" y="37.602" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.562" font-weight="normal" font-style="italic" fill="#7030A0"><tspan x="50" y="37.602">If a flow changes RTL (hash src/rtl/ before and after), checking flows that passed with the old RTL (dv, sanity, fpga)</tspan><tspan x="50" y="39.398">run again in chain order, up to pipeline.chain_max_runs times (default 3)</tspan></text><rect x="2" y="45" width="96" height="13" rx="1.2" fill="#F2F2F2" stroke="#595959" stroke-width="0.217"/><text x="50.0" y="49.653" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman, serif" font-size="1.606" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" y="49.653">q3tui auto / TUI /auto: runs the whole chain unattended — gates auto-approve and questions use their defaults;</tspan><tspan x="50.0" y="51.500">a failed flow stops the chain and prints a summary (flow, RTL changed, cost).</tspan><tspan x="50.0" y="53.347">Each flow can also run on its own: q3tui --flow rtl run; multiple flows can run in one project folder (one lock per flow).</tspan></text></svg>