# Q3TUI configuration — copy to ~/.q3tui/q3tui.yaml (user) or ./q3tui.yaml (project).
# Full schema: docs/spec/config.md
#
# The tool entries below are examples of how to describe your site's tools (adapter, binary, modules): they are not a required
# or recommended set. Replace them with the tools you have; Q3TUI ships none.

# pipeline:
#   flow: spec           # default (q3tui flow list)
#   auto_answer: false   # true: unattended — approve gates, confirm assertions, sign the ready requirements

llm:
  model: claude-sonnet-5-5
  effort: high
  # backend: codex       # run the stages on the Codex CLI instead (docs/spec/codex-backend.md)
  # codex: {model: null, effort: medium, prices: {"*": {input: 1.25, cached_input: 0.125, output: 10.0}}}

tools:
  modules_init: /usr/share/modules/init/bash   # default: $MODULESHOME/init/bash
  modules: []                                  # loaded before every EDA tool
  timeout_s: 600

  syntax:    {adapter: slang}
  simulator:                                   # VCS + Verdi (Verdi needed for FSDB dumping)
    adapter: vcs
    bin: vcs
    modules: [synopsys/vcs/X-2025.06, synopsys/verdi/X-2025.06]
  lint:
    adapter: spyglass
    bin: sg_shell
    modules: [synopsys/spyglass/T-2022.06]
  debug:
    adapter: verdi
    bin: verdi
    modules: [synopsys/verdi/X-2025.06]
